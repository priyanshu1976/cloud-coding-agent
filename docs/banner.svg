<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Cloud Agent: an AI coding agent that works in a sandbox while you watch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#17133a"/>
      <stop offset="1" stop-color="#0d2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow1)"/>
  <rect width="1280" height="360" fill="url(#glow2)"/>

  <!-- Logo mark: a cloud holding a terminal prompt -->
  <g transform="translate(88 92)">
    <path d="M62 120c-26 0-46-17-46-40 0-21 16-37 38-39 6-23 27-37 52-37 28 0 51 19 55 45 22 2 39 18 39 38 0 21-19 33-44 33z"
          fill="url(#accent)"/>
    <path d="M76 66l24 20-24 20" fill="none" stroke="#0b1020" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M112 108h38" stroke="#0b1020" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="320" y="170" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">Cloud Agent</text>
  <rect x="322" y="192" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="320" y="246" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#c7d2fe">Hand an AI agent a task.</text>
  <text x="320" y="282" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="25" fill="#c7d2fe">Watch it work inside a sandbox.</text>
  <text x="320" y="324" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#7dd3fc" fill-opacity="0.9">Anthropic · OpenAI · Gemini · Sarvam</text>

  <!-- Mini chat window -->
  <g filter="url(#shadow)" transform="translate(908 60)">
    <rect width="300" height="240" rx="16" fill="#12162b" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="22" r="6" fill="#febc2e"/>
    <circle cx="62" cy="22" r="6" fill="#28c840"/>
    <rect x="96" y="48" width="188" height="30" rx="15" fill="#2a2f55"/>
    <rect x="112" y="60" width="120" height="7" rx="3.5" fill="#a5b4fc"/>
    <rect x="16" y="94" width="150" height="7" rx="3.5" fill="#64748b"/>
    <rect x="16" y="112" width="228" height="34" rx="9" fill="#0b0e1d" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="28" y="134" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#2dd4bf">$ npm test</text>
    <rect x="16" y="160" width="236" height="22" rx="4" fill="#0f2f26"/>
    <rect x="28" y="168" width="150" height="6" rx="3" fill="#34d399"/>
    <rect x="16" y="186" width="236" height="22" rx="4" fill="#33141a"/>
    <rect x="28" y="194" width="100" height="6" rx="3" fill="#f87171"/>
    <circle cx="276" cy="216" r="12" fill="url(#accent)"/>
    <path d="M276 222v-12m0 0l-5 5m5-5l5 5" stroke="#0b1020" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
